services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/${NGINX_CONF:-prod-init.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - laravel

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: php
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_started
    restart: unless-stopped
    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: php
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_started
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - laravel

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: php
    command: php artisan schedule:work --verbose
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_started
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - laravel

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: php
    command: ["bash", "docker/php/reverb-start.sh"]
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - laravel

  mysql:
    image: mysql:8.0.38-debian
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - laravel

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $!; done"
    restart: unless-stopped
    networks:
      - laravel

volumes:
  db_data:
  redis_data:
  storage_data:
  certbot_certs:
  certbot_www:

networks:
  laravel:
    driver: bridge