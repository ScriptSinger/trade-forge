name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, redis, pcntl, zip
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Create artifact
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.prod.yml \
            package.json \
            package-lock.json \
            vite.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to EQVPS
    runs-on: ubuntu-latest
    needs: build-artifact
    if: github.repository == 'ScriptSinger/trade-forge'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST || secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          SSH_HOST="${{ secrets.SSH_HOST || secrets.DEPLOY_HOST }}"
          SSH_USER="${{ secrets.SSH_USER || secrets.DEPLOY_USER }}"
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/deploy/trade-forge}"

          scp -i ~/.ssh/id_ed25519 release.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/release.tar.gz"

          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" << EOF
          set -e
          cd ${DEPLOY_PATH}
          tar -xzf /tmp/release.tar.gz -C ${DEPLOY_PATH}
          rm -f /tmp/release.tar.gz
          echo "${{ secrets.ENV_FILE }}" > .env
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build
          for i in \$(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T mysql mysqladmin ping -h localhost --silent; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml run --rm php php artisan migrate --force
          docker compose -f docker-compose.prod.yml run --rm php php artisan optimize
          docker compose -f docker-compose.prod.yml restart queue scheduler reverb
          EOF